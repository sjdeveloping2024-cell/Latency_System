<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FS Check — Latency Scanner</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #161311;
    --line: #3a2a1c;
    --text: #f5e9dd;
    --text-dim: #a3897a;
    --accent: #ff8c2b;
    --accent-dim: #b35e17;
    --warn: #ffb454;
    --bad: #ff5c5c;
    --mono: "JetBrains Mono", "Consolas", "SFMono-Regular", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,140,43,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,140,43,0.05), transparent 40%);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .console {
    width: 100%;
    max-width: 640px;
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  .brand {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .brand strong {
    color: var(--accent);
  }

  .clock {
    font-size: 12px;
    color: var(--text-dim);
  }

  .titlebar-right {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .net {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    cursor: default;
  }

  .net-name {
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.25s ease;
  }

  .wifi-icon {
    display: block;
    flex: none;
    width: 17px;
    height: 15px;
    color: var(--text-dim);
    overflow: visible;
    transition: color 0.3s ease, filter 0.3s ease;
  }

  .wifi-icon .wave {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    opacity: 0.14;
    transition: opacity 0.25s ease;
  }

  .wifi-icon .wifi-dot {
    fill: currentColor;
    opacity: 0.14;
    transition: opacity 0.25s ease;
  }

  .wifi-icon .lit { opacity: 1; }

  .net[data-state="good"] .wifi-icon {
    color: var(--accent);
    filter: drop-shadow(0 0 4px rgba(255, 140, 43, 0.35));
  }
  .net[data-state="fair"] .wifi-icon { color: var(--warn); }
  .net[data-state="weak"] .wifi-icon { color: var(--bad); }
  .net[data-state="offline"] .wifi-icon { color: var(--text-dim); opacity: 0.55; }

  .net.live .wifi-icon .lit {
    animation: wifi-pulse 2.4s ease-in-out infinite;
  }
  .net.live .wifi-icon .wifi-dot { animation-delay: 0s; }
  .net.live .wifi-icon .wave-3 { animation-delay: 0.24s; }
  .net.live .wifi-icon .wave-2 { animation-delay: 0.48s; }
  .net.live .wifi-icon .wave-1 { animation-delay: 0.72s; }

  @keyframes wifi-pulse {
    0%, 100% { opacity: 1; }
    40% { opacity: 0.3; }
  }

  @media (max-width: 560px) {
    .net-name { display: none; }
  }

  h1 {
    font-size: 22px;
    margin: 4px 0 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  h1 span {
    color: var(--accent-dim);
  }

  .scan-btn {
    width: 100%;
    padding: 16px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(180deg, rgba(255,140,43,0.14), rgba(255,140,43,0.04));
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  .scan-btn:hover { background: rgba(255,140,43,0.2); }
  .scan-btn:active { transform: scale(0.995); }
  .scan-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .scan-btn .arrow {
    display: inline-block;
    margin-right: 8px;
    transition: transform 0.2s ease;
  }
  .scan-btn.scanning .arrow {
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .scan-btn.counting #btnLabel {
    font-variant-numeric: tabular-nums;
  }

  #result-wrap {
    margin-top: 18px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  #result-wrap.open {
    max-height: 600px;
  }

  .panel {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 4px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.7;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 12px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .status-pill {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .status-pill.stable { background: rgba(255,140,43,0.12); color: var(--accent); border: 1px solid var(--accent-dim); }
  .status-pill.unstable { background: rgba(255,180,84,0.12); color: var(--warn); border: 1px solid var(--warn); }
  .status-pill.down { background: rgba(255,92,92,0.12); color: var(--bad); border: 1px solid var(--bad); }

  .metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 10px;
  }

  .metric {
    padding: 10px 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--line);
    border-radius: 3px;
  }

  .metric-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .metric-value {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }
  .metric-value.accent { color: var(--accent); }

  .metric.graph-card {
    padding: 12px 14px 10px;
  }

  .graph-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-bottom: 8px;
  }

  .graph-head .metric-label {
    margin-bottom: 0;
  }

  .graph-meta {
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .graph-meta b {
    color: var(--text);
    font-weight: 600;
  }

  .net-graph {
    display: block;
    width: 100%;
    height: auto;
  }

  .net-graph .grid-line {
    stroke: rgba(245,233,221,0.07);
    stroke-width: 1;
  }

  .net-graph .axis-label {
    fill: var(--text-dim);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
  }

  .net-graph .value-label {
    fill: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }

  .net-graph .area {
    fill: url(#areaFill);
  }

  .net-graph .line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw-line 0.7s ease-out 0.05s forwards;
  }

  .net-graph .dot {
    fill: var(--accent);
    stroke: var(--panel);
    stroke-width: 2;
    animation: fade-in 0.35s ease-out both;
  }

  @keyframes draw-line { to { stroke-dashoffset: 0; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .net.live .wifi-icon .lit { animation: none; }
    .net-graph .line,
    .net-graph .dot { animation: none; stroke-dashoffset: 0; }
  }

  .again-btn {
    margin-top: 14px;
    width: 100%;
    padding: 11px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .again-btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .error-text {
    color: var(--bad);
    font-size: 13px;
  }

  footer {
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div class="console">
  <div class="titlebar">
    <div class="brand"><strong>FS</strong>_CHECK / v1.0</div>
    <div class="titlebar-right">
      <div class="net" id="net" data-state="offline" title="Checking Wi-Fi…" aria-label="Checking Wi-Fi">
        <svg class="wifi-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="wave wave-1" data-level="4" d="M2.9 8.6a13.6 13.6 0 0 1 18.2 0" />
          <path class="wave wave-2" data-level="3" d="M6.2 12.3a9 9 0 0 1 11.6 0" />
          <path class="wave wave-3" data-level="2" d="M9.5 16a4.4 4.4 0 0 1 5 0" />
          <circle class="wifi-dot" data-level="1" cx="12" cy="19.6" r="1.6" />
        </svg>
        <span class="net-name" id="netName">Wi-Fi</span>
      </div>
      <div class="clock" id="clock"></div>
    </div>
  </div>

  <h1>Network latency <span>scanner</span></h1>

  <div id="result-wrap">
    <div class="panel" id="panel"></div>
  </div>

  <button class="scan-btn" id="scanBtn" onclick="startScan()">
    <span class="arrow">&#10148;</span><span id="btnLabel">Scan it</span>
  </button>

  <footer>target: google.com &middot; 5 probes per scan &middot; icmp echo</footer>
</div>

<script>
const netEl = document.getElementById('net');
const netNameEl = document.getElementById('netName');

function applyNetwork(info) {
  const connected = Boolean(info && info.connected && info.ssid);
  const signal = connected ? Math.max(0, Math.min(100, Number(info.signal) || 0)) : 0;
  const level = !connected ? 0 : signal >= 75 ? 4 : signal >= 50 ? 3 : signal >= 25 ? 2 : 1;
  const state = !connected ? 'offline' : signal >= 65 ? 'good' : signal >= 35 ? 'fair' : 'weak';

  netEl.dataset.state = state;
  netEl.classList.toggle('live', connected);

  netEl.querySelectorAll('.wifi-icon [data-level]').forEach(el => {
    el.classList.toggle('lit', connected && Number(el.dataset.level) <= level);
  });

  netNameEl.textContent = connected ? info.ssid : 'No Wi-Fi';

  if (connected) {
    const details = [`${signal}% signal`];
    if (info.band) details.push(info.band);
    if (info.receive_mbps != null) details.push(`${info.receive_mbps} Mbps`);
    netEl.title = `${info.ssid} · ${details.join(' · ')}`;
  } else {
    netEl.title = 'No Wi-Fi network detected';
  }
  netEl.setAttribute('aria-label', netEl.title);
}

async function refreshNetwork() {
  try {
    const res = await fetch('/network', { cache: 'no-store' });
    if (!res.ok) throw new Error('Network check failed');
    applyNetwork(await res.json());
  } catch (err) {
    applyNetwork(null);
  }
}

refreshNetwork();
setInterval(() => { if (!document.hidden) refreshNetwork(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshNetwork(); });
window.addEventListener('online', refreshNetwork);
window.addEventListener('offline', () => applyNetwork(null));

function tickClock() {
  const el = document.getElementById('clock');
  const now = new Date();
  el.textContent = now.toLocaleTimeString([], {hour12:false});
}
setInterval(tickClock, 1000);
tickClock();

function startScan() {
  const btn = document.getElementById('scanBtn');
  const label = document.getElementById('btnLabel');

  btn.disabled = true;
  btn.classList.add('counting');

  let n = 5;
  label.textContent = `Scanning in ${n}...`;

  const interval = setInterval(() => {
    n -= 1;
    if (n > 0) {
      label.textContent = `Scanning in ${n}...`;
    } else {
      clearInterval(interval);
      btn.classList.remove('counting');
      runScan();
    }
  }, 1000);
}

async function runScan() {
  const btn = document.getElementById('scanBtn');
  const label = document.getElementById('btnLabel');
  const wrap = document.getElementById('result-wrap');
  const panel = document.getElementById('panel');

  btn.classList.add('scanning');
  label.textContent = 'Scanning...';

  try {
    const res = await fetch('/scan');
    const data = await res.json();
    panel.innerHTML = renderResult(data);
    wrap.classList.add('open');
  } catch (err) {
    panel.innerHTML = `<div class="error-text">Scan failed: could not reach server.</div>`;
    wrap.classList.add('open');
  }

  btn.disabled = false;
  btn.classList.remove('scanning');
  label.textContent = 'Scan again';
}

function renderResult(data) {
  if (!data.success) {
    return `
      <div class="panel-header">
        <span>Result</span>
        <span class="status-pill down">No response</span>
      </div>
      <div class="error-text">${data.message}</div>
    `;
  }

  const statusClass = data.stable ? 'stable' : 'unstable';
  const statusLabel = data.stable ? 'Stable' : 'Unstable';
  const pings = data.pings_ms;
  const minMs = Math.min(...pings);
  const maxMs = Math.max(...pings);

  return `
    <div class="panel-header">
      <span>Result &middot; ${data.target}</span>
      <span class="status-pill ${statusClass}">${statusLabel}</span>
    </div>
    <div class="metric-grid">
      <div class="metric">
        <div class="metric-label">Average latency</div>
        <div class="metric-value accent">${data.average_ms} ms</div>
      </div>
      <div class="metric">
        <div class="metric-label">Jitter</div>
        <div class="metric-value">${data.jitter_ms} ms</div>
      </div>
    </div>
    <div class="metric graph-card">
      <div class="graph-head">
        <span class="metric-label">Network graph</span>
        <span class="graph-meta">min <b>${minMs}</b> &middot; avg <b>${data.average_ms}</b> &middot; max <b>${maxMs}</b> ms</span>
      </div>
      ${renderGraph(pings)}
    </div>
  `;
}

function renderGraph(pings) {
  if (!pings.length) return '';

  const W = 560, H = 168;
  const pad = { top: 26, right: 16, bottom: 26, left: 36 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;

  const min = Math.min(...pings);
  const max = Math.max(...pings);
  const spread = Math.max(max - min, 1);
  const lo = Math.max(0, min - spread * 0.35);
  const hi = max + spread * 0.35;
  const range = Math.max(hi - lo, 0.001);

  const xAt = i => {
    const inset = 12;
    const usableW = plotW - inset * 2;
    return pings.length === 1
      ? pad.left + plotW / 2
      : pad.left + inset + (usableW * i) / (pings.length - 1);
  };
  const yAt = v => pad.top + plotH - ((v - lo) / range) * plotH;
  const axisLabel = v => range < 6 ? v.toFixed(1) : Math.round(v).toString();

  const points = pings.map((v, i) => ({ x: xAt(i), y: yAt(v), v }));
  const linePath = points
    .map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`)
    .join(' ');

  const baseline = pad.top + plotH;
  const areaPath = `${linePath} L${points[points.length - 1].x.toFixed(1)},${baseline} L${points[0].x.toFixed(1)},${baseline} Z`;

  const grid = [0, 0.5, 1].map(t => {
    const y = pad.top + plotH * t;
    const label = axisLabel(hi - range * t);
    return `<line class="grid-line" x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" />
      <text class="axis-label" x="${pad.left - 8}" y="${y + 3}" text-anchor="end">${label}</text>`;
  }).join('');

  const marks = points.map((p, i) => `
    <circle class="dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" />
    <text class="value-label" x="${p.x.toFixed(1)}" y="${(p.y - 10).toFixed(1)}" text-anchor="middle">${p.v}</text>
    <text class="axis-label" x="${p.x.toFixed(1)}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`).join('');

  return `
    <svg class="net-graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Latency per probe in milliseconds">
      <title>Latency per probe in milliseconds</title>
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff8c2b" stop-opacity="0.26" />
          <stop offset="100%" stop-color="#ff8c2b" stop-opacity="0" />
        </linearGradient>
      </defs>
      ${grid}
      <path class="area" d="${areaPath}" />
      <path class="line" pathLength="1" d="${linePath}" />
      ${marks}
    </svg>
  `;
}
</script>

</body>
</html>
